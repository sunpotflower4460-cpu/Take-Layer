name: TakeLayer
options:
  bundleIdPrefix: com.sunpotflower4460
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  TakeLayer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TakeLayer
        excludes:
          - Resources/Info.plist
          - Features/ImportExportPoC
    info:
      path: TakeLayer/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunpotflower4460.TakeLayer
        PRODUCT_NAME: TakeLayer
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
  TakeLayerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TakeLayerTests
    dependencies:
      - target: TakeLayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunpotflower4460.TakeLayerTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TakeLayer:
    build:
      targets:
        TakeLayer: all
        TakeLayerTests:
          - test
    test:
      gatherCoverageData: true
      targets:
        - TakeLayerTests
